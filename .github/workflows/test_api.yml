name: Test API
run-name: Test API

on:
  workflow_dispatch: 
    inputs:
      environment:
        type: environment
        default: test
        required: true

permissions: {}

jobs:
  test-api:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: cd qa && npm install

      - name: Run
        env:
          BASE_URL: 'https://${{ vars.SUBDOMAIN }}.seattle.gov'
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROGRAM_SLUGS: ${{ secrets.PROGRAM_SLUGS }}
        run: cd qa && npx playwright test

      - name: On Failure
        if: failure()
        run: echo "FAILED"

          - name: Send failure alert to Slack
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "🚨 *CiviForm Login Test Failed* 🚨\nThe SSO/IDCS login flow may be broken. View run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Force send test alert to Slack
        if: (env.FORCE_SEND_SLACK_MESSAGE == 'true')
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "✅ *CiviForm Login Test Notification Check* ✅\nNothing is wrong. This is a manual test to verify the Slack connection from the GitHub workflow. View run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

