name: Test CiviForm Login

on:
  workflow_dispatch:
    inputs:
      force_send_teams_message:
        type: boolean
        description: 'Message Teams anyway'
        default: false
        required: false

  schedule:
    # Runs at the top of every hour. Adjust the cron syntax if you want a different frequency.
    - cron: '0 * * * *'

permissions: {}

jobs:
  test-civiform-login:
    runs-on: ubuntu-latest

    env:
      FORCE_SEND_TEAMS_MESSAGE: ${{ (github.event.inputs != null && github.event.inputs.force_send_teams_message == 'true') }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # New Step: Playwright requires Node.js to run
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # New Step: Install Playwright and the necessary Linux dependencies for headless Chromium
      - name: Install Playwright & Browsers
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run CiviForm login testing script
        env:
          # Injecting the repository secrets securely into the script's environment
          SEATTLE_LOGIN_USERNAME: ${{ secrets.SEATTLE_LOGIN_USERNAME }}
          SEATTLE_LOGIN_PASSWORD: ${{ secrets.SEATTLE_LOGIN_PASSWORD }}
        run: bin/test_idcs.sh
              
      - name: Send message to ms teams   
        if: failure()
        uses: dhollerbach/actions.send-message-to-ms-teams@1.0.10
        with:
          webhook: '${{ secrets.MICROSOFT_TEAMS_WEBHOOK_URI }}'
          message: 'Testing CiviForm Login failed. The SSO/IDCS login flow may be broken. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Force send test message to ms teams
        if: (env.FORCE_SEND_TEAMS_MESSAGE == 'true')
        uses: dhollerbach/actions.send-message-to-ms-teams@1.0.10
        with:
          webhook: '${{ secrets.MICROSOFT_TEAMS_WEBHOOK_URI }}'
          message: 'Nothing is wrong. Just testing the teams connection from the CiviForm Login workflow.'