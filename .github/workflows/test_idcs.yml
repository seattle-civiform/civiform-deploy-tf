name: Test CiviForm Login

on:
  workflow_dispatch:
    inputs:
      force_send_slack_message:
        type: boolean
        description: 'Send test Slack message anyway'
        default: false
        required: false

  schedule:
    # Runs at the top of every hour
    - cron: '0 */8 * * *'

permissions: {}

jobs:
  test-civiform-login:
    runs-on: ubuntu-latest

    env:
      FORCE_SEND_SLACK_MESSAGE: ${{ (github.event.inputs != null && github.event.inputs.force_send_slack_message == 'true') }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright & Browsers
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run CiviForm login testing script
        env:
          SEATTLE_LOGIN_USERNAME: ${{ secrets.SEATTLE_LOGIN_USERNAME }}
          SEATTLE_LOGIN_PASSWORD: ${{ secrets.SEATTLE_LOGIN_PASSWORD }}
        run: bin/test_idcs.sh
              
      - name: Send failure alert to Slack
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "🚨 *CiviForm Login Test Failed* 🚨\nThe SSO/IDCS login flow may be broken. View run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Force send test alert to Slack
        if: (env.FORCE_SEND_SLACK_MESSAGE == 'true')
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "✅ *CiviForm Login Test Notification Check* ✅\nNothing is wrong. This is a manual test to verify the Slack connection from the GitHub workflow. View run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }