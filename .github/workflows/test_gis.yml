name: Test GIS

on:
  workflow_dispatch:
    inputs:
      force_send_teams_message:
        type: boolean
        description: 'Message Teams anyway'
        default: false
        required: false
      force_send_slack_message:
        type: boolean
        description: 'Send Slack message anyway'
        default: false
        required: false
        
  schedule:
    - cron: '0 * * * *'

permissions: {}

jobs:
  test-gis:
    runs-on: ubuntu-latest

    env:
      FORCE_SEND_TEAMS_MESSAGE: ${{ (github.event.inputs != null && github.event.inputs.force_send_teams_message == 'true') }}
      FORCE_SEND_SLACK_MESSAGE: ${{ (github.event.inputs != null && github.event.inputs.force_send_slack_message == 'true') }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run gis testing script
        run: bin/test_gis.sh
              
      - name: Send message to ms teams   
        if: failure()
        uses: dhollerbach/actions.send-message-to-ms-teams@1.0.10
        with:
          webhook: '${{ secrets.MICROSOFT_TEAMS_WEBHOOK_URI }}'
          message: 'Testing GIS failed. There *may* be issues afoot. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Force send test message to ms teams
        if: (env.FORCE_SEND_TEAMS_MESSAGE == 'true')
        uses: dhollerbach/actions.send-message-to-ms-teams@1.0.10
        with:
          webhook: '${{ secrets.MICROSOFT_TEAMS_WEBHOOK_URI }}'
          message: 'Nothing is wrong. Just testing the teams connection.'
      
      - name: Send failure alert to Slack
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "🚨 *CiviForm GIS Test Failed* 🚨\nThe GIS flow may be broken. View run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Force send test alert to Slack
        if: (env.FORCE_SEND_SLACK_MESSAGE == 'true')
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "✅ *CiviForm GIS Test Notification Check* ✅\nNothing is wrong. This is a manual test to verify the Slack connection from the GitHub workflow. View run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }